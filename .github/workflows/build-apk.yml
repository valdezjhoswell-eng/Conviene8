name: Compilar RentableZone APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descargar RentableZone 0.7.1
        run: |
          mkdir -p proyecto
          unzip -o RentableZone_A11_v0.7.1_fixed.zip -d proyecto

      - name: Compilar APK 0.7.1
        working-directory: proyecto/RentableZone
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RentableZone-v0.7.1
          path: proyecto/RentableZone/app/build/outputs/apk/debug/app-debug.apk
